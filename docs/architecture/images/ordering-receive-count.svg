<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Receives count deliveries, not attempts</title>
  <desc id="desc">A grid of five deliveries for two messages in the same group. Message m3 fails in every delivery. Message m4 is skipped in every delivery because it waits behind m3. After five receives, SQS moves both to the dead-letter queue, although m4 was never attempted.</desc>
  <style>
    .bg { fill: #ffffff; }
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 20px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #59636e; }
    .label { font-size: 14px; font-weight: 600; }
    .header { font-size: 13px; font-weight: 600; }
    .small { font-size: 12px; fill: #59636e; }
    .alert { font-size: 12px; font-weight: 600; fill: #cf222e; }
    .center { text-anchor: middle; }
    .fail { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
    .wait { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .dlq { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .rule { stroke: #d1d9e0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      text { fill: #e6edf3; }
      .subtitle, .small { fill: #9198a1; }
      .alert { fill: #ff7b72; }
      .fail { fill: #301214; stroke: #f85149; }
      .wait { fill: #2b2111; stroke: #d29922; }
      .dlq { fill: #231537; stroke: #a371f7; }
      .rule { stroke: #3d444d; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="960" height="320" rx="16"/>
  <text class="title" x="32" y="46">Receives count deliveries, not attempts</text>
  <text class="subtitle" x="32" y="70">m3 keeps failing, so m4, waiting behind it in the same group, is skipped in every batch.</text>

  <!-- Column headers. -->
  <text class="header center" x="242" y="112">Delivery 1</text>
  <text class="header center" x="358" y="112">Delivery 2</text>
  <text class="header center" x="474" y="112">Delivery 3</text>
  <text class="header center" x="590" y="112">Delivery 4</text>
  <text class="header center" x="706" y="112">Delivery 5</text>
  <text class="header center" x="854" y="112">Next receive</text>
  <line class="rule" x1="32" y1="122" x2="928" y2="122"/>

  <!-- m3 fails in every delivery. -->
  <text class="label" x="32" y="150">m3</text>
  <text class="small" x="32" y="168">payment p3</text>
  <rect class="fail" x="190" y="130" width="104" height="46" rx="8"/>
  <text class="label center" x="242" y="150">failed</text>
  <text class="small center" x="242" y="167">receive 1</text>
  <rect class="fail" x="306" y="130" width="104" height="46" rx="8"/>
  <text class="label center" x="358" y="150">failed</text>
  <text class="small center" x="358" y="167">receive 2</text>
  <rect class="fail" x="422" y="130" width="104" height="46" rx="8"/>
  <text class="label center" x="474" y="150">failed</text>
  <text class="small center" x="474" y="167">receive 3</text>
  <rect class="fail" x="538" y="130" width="104" height="46" rx="8"/>
  <text class="label center" x="590" y="150">failed</text>
  <text class="small center" x="590" y="167">receive 4</text>
  <rect class="fail" x="654" y="130" width="104" height="46" rx="8"/>
  <text class="label center" x="706" y="150">failed</text>
  <text class="small center" x="706" y="167">receive 5</text>
  <rect class="dlq" x="780" y="130" width="148" height="46" rx="8"/>
  <text class="label center" x="854" y="150">moved to DLQ</text>
  <text class="small center" x="854" y="167">after 5 receives</text>

  <!-- m4 is skipped in every delivery. -->
  <text class="label" x="32" y="212">m4</text>
  <text class="small" x="32" y="230">payment p4</text>
  <rect class="wait" x="190" y="192" width="104" height="46" rx="8"/>
  <text class="label center" x="242" y="212">skipped</text>
  <text class="small center" x="242" y="229">receive 1</text>
  <rect class="wait" x="306" y="192" width="104" height="46" rx="8"/>
  <text class="label center" x="358" y="212">skipped</text>
  <text class="small center" x="358" y="229">receive 2</text>
  <rect class="wait" x="422" y="192" width="104" height="46" rx="8"/>
  <text class="label center" x="474" y="212">skipped</text>
  <text class="small center" x="474" y="229">receive 3</text>
  <rect class="wait" x="538" y="192" width="104" height="46" rx="8"/>
  <text class="label center" x="590" y="212">skipped</text>
  <text class="small center" x="590" y="229">receive 4</text>
  <rect class="wait" x="654" y="192" width="104" height="46" rx="8"/>
  <text class="label center" x="706" y="212">skipped</text>
  <text class="small center" x="706" y="229">receive 5</text>
  <rect class="dlq" x="780" y="192" width="148" height="46" rx="8"/>
  <text class="label center" x="854" y="212">moved to DLQ</text>
  <text class="alert center" x="854" y="229">never attempted</text>

  <line class="rule" x1="32" y1="256" x2="928" y2="256"/>
  <text class="small" x="32" y="280">SQS counts every delivery, so it cannot tell the broken message from the one waiting behind it.</text>
  <text class="small" x="32" y="300">Whatever shares those batches reaches the dead-letter queue with it.</text>
</svg>
