<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="title desc">
  <title id="title">Planned processing flow with a retry queue</title>
  <desc id="desc">Webhook receipt sends each event to webhook_events.fifo, where each subject, such as gatewayBrazil payment p1, has its own message group. The webhook worker reads batches and starts a named durable workflow, such as GrantSubscription or RevokeAccess, whose steps change the subject state only when the event ranks higher. A temporary failure moves the message to the standard webhook_events_retry queue with a delay, and the worker handles it again afterwards. Invalid messages and messages out of retries are parked in webhook_events_dlq.fifo. As a safety net, SQS moves messages the worker never answered to a dead-letter queue after 5 receives: webhook_events_dlq.fifo for the main queue and webhook_events_retry_dlq for the retry queue.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 20px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #59636e; }
    .label { font-size: 14px; font-weight: 600; }
    .small { font-size: 12px; fill: #59636e; }
    .legend { font-size: 13px; }
    .center { text-anchor: middle; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    .mono-label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
    .queue { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.5; }
    .lane { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .box { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .item { fill: #eef1f4; stroke: none; }
    .msg { fill: #ddf4ff; stroke: #0969da; stroke-width: 1; }
    .retry { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .dlq { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .store { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #1f2328; stroke-width: 1.75; }
    .dashed { stroke-dasharray: 6 4; }
    .arrowhead { fill: #1f2328; }
    .badge { fill: #1f2328; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      text { fill: #e6edf3; }
      .subtitle, .small { fill: #9198a1; }
      .queue { fill: #161b22; stroke: #c9d1d9; }
      .lane { fill: #0d1117; stroke: #656c76; }
      .box { fill: #0d1117; stroke: #c9d1d9; }
      .item { fill: #212830; }
      .msg { fill: #0c2d4b; stroke: #4493f8; }
      .retry { fill: #2b2111; stroke: #d29922; }
      .dlq { fill: #231537; stroke: #a371f7; }
      .store { fill: #12261e; stroke: #3fb950; }
      .arrow { stroke: #c9d1d9; }
      .arrowhead { fill: #c9d1d9; }
      .badge { fill: #e6edf3; }
      .badge-text { fill: #0d1117; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1000" height="660" rx="16"/>
  <text class="title" x="24" y="46">Planned flow: failures leave the ordered queue</text>
  <text class="subtitle" x="24" y="70">Each subject keeps its order, and a failed message waits in a separate queue instead of blocking the others.</text>

  <!-- Receipt. -->
  <rect class="box" x="24" y="150" width="150" height="62" rx="10"/>
  <text class="label center" x="99" y="176">Webhook receipt</text>
  <text class="small center" x="99" y="196">entry point Lambda</text>

  <!-- Main FIFO queue, one message group per subject. -->
  <rect class="queue" x="214" y="100" width="330" height="166" rx="14"/>
  <text class="mono-label center" x="379" y="124">webhook_events.fifo</text>
  <text class="small center" x="379" y="142">FIFO · one message group per subject</text>
  <rect class="lane" x="230" y="154" width="298" height="28" rx="14"/>
  <text class="mono" x="244" y="172">gatewayBrazil#payment#p1</text>
  <rect class="msg" x="452" y="159" width="18" height="18" rx="4"/>
  <rect class="msg" x="476" y="159" width="18" height="18" rx="4"/>
  <rect class="msg" x="500" y="159" width="18" height="18" rx="4"/>
  <rect class="lane" x="230" y="188" width="298" height="28" rx="14"/>
  <text class="mono" x="244" y="206">gatewayBrazil#payment#p2</text>
  <rect class="msg" x="500" y="193" width="18" height="18" rx="4"/>
  <rect class="lane" x="230" y="222" width="298" height="28" rx="14"/>
  <text class="mono" x="244" y="240">gatewayGlobal#subscription#s1</text>
  <rect class="msg" x="476" y="227" width="18" height="18" rx="4"/>
  <rect class="msg" x="500" y="227" width="18" height="18" rx="4"/>

  <!-- Worker. -->
  <rect class="box" x="608" y="140" width="192" height="86" rx="10"/>
  <text class="label center" x="704" y="170">webhook_worker</text>
  <text class="small center" x="704" y="190">chooses the action and</text>
  <text class="small center" x="704" y="206">starts its workflow</text>

  <!-- Durable workflows. -->
  <rect class="box" x="848" y="110" width="128" height="146" rx="10"/>
  <text class="label center" x="912" y="134">Durable</text>
  <text class="label center" x="912" y="152">workflows</text>
  <rect class="item" x="856" y="166" width="112" height="24" rx="6"/>
  <text class="mono center" x="912" y="182">GrantSubscription</text>
  <rect class="item" x="856" y="196" width="112" height="24" rx="6"/>
  <text class="mono center" x="912" y="212">RevokeAccess</text>
  <rect class="item" x="856" y="226" width="112" height="24" rx="6"/>
  <text class="mono center" x="912" y="242">…</text>

  <!-- Subject state. -->
  <rect class="store" x="848" y="316" width="128" height="68" rx="10"/>
  <text class="label center" x="912" y="344">Subject state</text>
  <text class="small center" x="912" y="364">DynamoDB, ranked</text>

  <!-- Retry queue. -->
  <rect class="retry" x="610" y="320" width="220" height="60" rx="30"/>
  <text class="mono-label center" x="720" y="346">webhook_events_retry</text>
  <text class="small center" x="720" y="366">standard · delayed retries</text>

  <!-- Dead-letter queues. -->
  <rect class="dlq" x="214" y="440" width="330" height="60" rx="30"/>
  <text class="mono-label center" x="379" y="466">webhook_events_dlq.fifo</text>
  <text class="small center" x="379" y="486">FIFO · parked for operators</text>
  <rect class="dlq" x="610" y="440" width="220" height="60" rx="30"/>
  <text class="mono-label center" x="720" y="466">webhook_events_retry_dlq</text>
  <text class="small center" x="720" y="486">standard · safety net</text>

  <!-- Arrows. -->
  <path class="arrow" d="M174,181 H212" marker-end="url(#head)"/>
  <path class="arrow" d="M544,183 H606" marker-end="url(#head)"/>
  <path class="arrow" d="M800,183 H846" marker-end="url(#head)"/>
  <path class="arrow" d="M912,256 V314" marker-end="url(#head)"/>
  <path class="arrow" d="M690,226 V318" marker-end="url(#head)"/>
  <path class="arrow" d="M750,320 V228" marker-end="url(#head)"/>
  <path class="arrow" d="M608,215 H584 V470 H546" marker-end="url(#head)"/>
  <path class="arrow dashed" d="M379,266 V438" marker-end="url(#head)"/>
  <path class="arrow dashed" d="M720,380 V438" marker-end="url(#head)"/>

  <!-- Step badges. -->
  <circle class="badge" cx="193" cy="181" r="11"/>
  <text class="badge-text" x="193" y="185">1</text>
  <circle class="badge" cx="575" cy="183" r="11"/>
  <text class="badge-text" x="575" y="187">2</text>
  <circle class="badge" cx="823" cy="183" r="11"/>
  <text class="badge-text" x="823" y="187">3</text>
  <circle class="badge" cx="912" cy="285" r="11"/>
  <text class="badge-text" x="912" y="289">4</text>
  <circle class="badge" cx="690" cy="272" r="11"/>
  <text class="badge-text" x="690" y="276">5</text>
  <circle class="badge" cx="750" cy="272" r="11"/>
  <text class="badge-text" x="750" y="276">6</text>
  <circle class="badge" cx="584" cy="340" r="11"/>
  <text class="badge-text" x="584" y="344">7</text>
  <circle class="badge" cx="379" cy="352" r="11"/>
  <text class="badge-text" x="379" y="356">8</text>
  <circle class="badge" cx="720" cy="409" r="11"/>
  <text class="badge-text" x="720" y="413">8</text>

  <!-- Legend. -->
  <circle class="badge" cx="35" cy="547" r="11"/>
  <text class="badge-text" x="35" y="551">1</text>
  <text class="legend" x="56" y="552">Receipt sends each event to its subject's message group.</text>
  <circle class="badge" cx="35" cy="573" r="11"/>
  <text class="badge-text" x="35" y="577">2</text>
  <text class="legend" x="56" y="578">The worker receives batches; each subject's events stay in order.</text>
  <circle class="badge" cx="35" cy="599" r="11"/>
  <text class="badge-text" x="35" y="603">3</text>
  <text class="legend" x="56" y="604">It starts the event's workflow; a repeated start reuses it.</text>
  <circle class="badge" cx="35" cy="625" r="11"/>
  <text class="badge-text" x="35" y="629">4</text>
  <text class="legend" x="56" y="630">Steps change the state only when the event ranks higher.</text>
  <circle class="badge" cx="515" cy="547" r="11"/>
  <text class="badge-text" x="515" y="551">5</text>
  <text class="legend" x="536" y="552">A temporary failure moves the message here, with a delay.</text>
  <circle class="badge" cx="515" cy="573" r="11"/>
  <text class="badge-text" x="515" y="577">6</text>
  <text class="legend" x="536" y="578">After the delay, the worker handles it again.</text>
  <circle class="badge" cx="515" cy="599" r="11"/>
  <text class="badge-text" x="515" y="603">7</text>
  <text class="legend" x="536" y="604">Invalid messages and spent retries are parked at once.</text>
  <circle class="badge" cx="515" cy="625" r="11"/>
  <text class="badge-text" x="515" y="629">8</text>
  <text class="legend" x="536" y="630">Safety net: SQS moves unanswered messages after 5 receives.</text>
</svg>
