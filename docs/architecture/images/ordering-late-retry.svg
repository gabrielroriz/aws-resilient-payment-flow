<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="title desc">
  <title id="title">A late retry cannot undo a refund</title>
  <desc id="desc">A timeline in four lanes: main queue, retry queue, workflows, and the state of payment p1. Message m3, payment.succeeded, fails on a temporary error and moves to the retry queue. Message m4, refund.created, is handled at once, and RevokeAccess records the refund with rank 03. Thirty seconds later m3 is delivered again and starts GrantSubscription, whose event ranks 02, lower than 03, so the grant is not applied and access stays revoked.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 20px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #59636e; }
    .label { font-size: 14px; font-weight: 600; }
    .small { font-size: 12px; fill: #59636e; }
    .legend { font-size: 13px; }
    .center { text-anchor: middle; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
    .frame { fill: none; stroke: #d1d9e0; stroke-width: 1; }
    .band { fill: #f6f8fa; }
    .rule { stroke: #d1d9e0; stroke-width: 1; }
    .box { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .ok { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .fail { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
    .retry { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .stale { fill: #f6f8fa; stroke: #59636e; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .arrow { fill: none; stroke: #1f2328; stroke-width: 1.75; }
    .arrowhead { fill: #1f2328; }
    .badge { fill: #1f2328; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      text { fill: #e6edf3; }
      .subtitle, .small { fill: #9198a1; }
      .frame, .rule { stroke: #3d444d; }
      .band { fill: #151b23; }
      .box { fill: #0d1117; stroke: #c9d1d9; }
      .ok { fill: #12261e; stroke: #3fb950; }
      .fail { fill: #301214; stroke: #f85149; }
      .retry { fill: #2b2111; stroke: #d29922; }
      .stale { fill: #151b23; stroke: #9198a1; }
      .arrow { stroke: #c9d1d9; }
      .arrowhead { fill: #c9d1d9; }
      .badge { fill: #e6edf3; }
      .badge-text { fill: #0d1117; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1000" height="580" rx="16"/>
  <text class="title" x="24" y="46">Example: a late retry cannot undo a refund</text>
  <text class="subtitle" x="24" y="70">Payment p1 at gatewayBrazil: m3 reports payment.succeeded, then m4 reports refund.created.</text>

  <!-- Lanes. -->
  <rect class="band" x="24" y="110" width="172" height="320"/>
  <rect class="frame" x="24" y="110" width="952" height="320" rx="10"/>
  <line class="rule" x1="24" y1="190" x2="976" y2="190"/>
  <line class="rule" x1="24" y1="270" x2="976" y2="270"/>
  <line class="rule" x1="24" y1="350" x2="976" y2="350"/>
  <line class="rule" x1="196" y1="110" x2="196" y2="430"/>
  <text class="label" x="38" y="146">Main queue</text>
  <text class="small" x="38" y="164">group of payment p1</text>
  <text class="label" x="38" y="226">Retry queue</text>
  <text class="small" x="38" y="244">standard, delayed</text>
  <text class="label" x="38" y="306">Workflows</text>
  <text class="small" x="38" y="324">durable functions</text>
  <text class="label" x="38" y="386">Payment p1</text>
  <text class="small" x="38" y="404">applied state and rank</text>

  <!-- Step 1: m3 fails and moves to the retry queue. -->
  <circle class="badge" cx="300" cy="92" r="11"/>
  <text class="badge-text" x="300" y="96">1</text>
  <rect class="fail" x="232" y="124" width="136" height="52" rx="8"/>
  <text class="label center" x="300" y="145">m3 fails</text>
  <text class="small center" x="300" y="164">payment.succeeded</text>
  <path class="arrow" d="M300,176 V202" marker-end="url(#head)"/>
  <rect class="retry" x="232" y="204" width="136" height="52" rx="8"/>
  <text class="label center" x="300" y="225">m3 waits</text>
  <text class="small center" x="300" y="244">retry in 30 s</text>

  <!-- Step 2: m4 runs at once and revokes access. -->
  <circle class="badge" cx="490" cy="92" r="11"/>
  <text class="badge-text" x="490" y="96">2</text>
  <rect class="ok" x="422" y="124" width="136" height="52" rx="8"/>
  <text class="label center" x="490" y="145">m4 handled</text>
  <text class="small center" x="490" y="164">refund.created</text>
  <path class="arrow" d="M490,176 V282" marker-end="url(#head)"/>
  <rect class="box" x="422" y="284" width="136" height="52" rx="8"/>
  <text class="mono center" x="490" y="306">RevokeAccess</text>
  <text class="small center" x="490" y="324">starts at once</text>
  <path class="arrow" d="M490,336 V362" marker-end="url(#head)"/>
  <rect class="ok" x="422" y="364" width="136" height="52" rx="8"/>
  <text class="label center" x="490" y="385">refunded</text>
  <text class="small center" x="490" y="404">applied rank 03</text>

  <!-- Step 3: m3 is delivered again and starts the grant. -->
  <circle class="badge" cx="680" cy="92" r="11"/>
  <text class="badge-text" x="680" y="96">3</text>
  <rect class="box" x="612" y="204" width="136" height="52" rx="8"/>
  <text class="label center" x="680" y="225">m3 again</text>
  <text class="small center" x="680" y="244">after 30 s</text>
  <path class="arrow" d="M680,256 V282" marker-end="url(#head)"/>
  <rect class="box" x="612" y="284" width="136" height="52" rx="8"/>
  <text class="mono center" x="680" y="306">GrantSubscription</text>
  <text class="small center" x="680" y="324">event rank 02</text>

  <!-- Step 4: the lower rank is not applied. -->
  <circle class="badge" cx="873" cy="92" r="11"/>
  <text class="badge-text" x="873" y="96">4</text>
  <path class="arrow" d="M748,310 H873 V362" marker-end="url(#head)"/>
  <rect class="stale" x="790" y="364" width="166" height="52" rx="8"/>
  <text class="label center" x="873" y="385">not applied</text>
  <text class="small center" x="873" y="404">02 ranks below 03</text>

  <!-- Legend. -->
  <circle class="badge" cx="35" cy="465" r="11"/>
  <text class="badge-text" x="35" y="469">1</text>
  <text class="legend" x="56" y="470">m3 fails on a temporary error, so it moves to the retry queue with a 30 s delay and is acknowledged.</text>
  <circle class="badge" cx="35" cy="491" r="11"/>
  <text class="badge-text" x="35" y="495">2</text>
  <text class="legend" x="56" y="496">m4 is not held back: RevokeAccess applies the refund and stores its rank, 03.</text>
  <circle class="badge" cx="35" cy="517" r="11"/>
  <text class="badge-text" x="35" y="521">3</text>
  <text class="legend" x="56" y="522">30 s later, the worker handles m3 again and starts GrantSubscription.</text>
  <circle class="badge" cx="35" cy="543" r="11"/>
  <text class="badge-text" x="35" y="547">4</text>
  <text class="legend" x="56" y="548">Its event ranks 02, below the applied 03, so the grant is recorded as stale and access stays revoked.</text>
</svg>
