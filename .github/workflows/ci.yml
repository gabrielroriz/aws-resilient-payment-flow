name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run format:check
      # Type-checks all code, including the local tooling and simulator that deployment skips.
      - run: npm run typecheck
      # Bundles the functions the way deployment does.
      - run: npm run build
      - run: npm test
