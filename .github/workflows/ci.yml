name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      # Type-checks the Lambda code and build tooling, catching @Injectable lists that do not match
      # their constructors, then bundles.
      - run: npm run build
      - run: npm test
