# Local stand-ins for AWS services, started by npm run dev.
# Lambdas that SAM runs join this network, so they reach each service by its name.
# Host tools use the published ports.
name: aws-resilient-payment-flow

services:
  # Starts without tables; npm run dev creates the ones Terraform defines.
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    # One database for every access key and region, so all clients share the tables.
    # It lives in a volume, so data survives container restarts.
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    # The image's default user cannot write to a new named volume, which root owns.
    user: root
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      # Any reply, even an error for this unsigned request, means the server is up.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Web UI for browsing and editing DynamoDB Local tables.
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:5.3.4
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      dynamodb:
        condition: service_healthy

  # SQS-compatible queues.
  # Starts without queues; npm run dev creates the ones Terraform defines.
  sqs:
    image: softwaremill/elasticmq-native:1.7.1
    # Queue URLs take each request's host, so they work for Lambdas and host tools.
    # Queues and messages live in memory and end with the container.
    command: -Dnode-address.host=*
    ports:
      - "127.0.0.1:9324:9324"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://localhost:9324/?Action=ListQueues'"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Web UI for browsing queues and sending, receiving, and deleting their messages.
  # It receives only on request, so browsing never counts toward redrive limits.
  sqs-admin:
    image: softwaremill/elasticmq-ui:1.7.1
    environment:
      # Its own port, since the API takes the image's default of 3000.
      PORT: 9325
      SQS_ENDPOINT: http://sqs:9324
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "127.0.0.1:9325:9325"
    depends_on:
      sqs:
        condition: service_healthy

volumes:
  dynamodb-data:

networks:
  default:
    # Must match the network npm run dev attaches the Lambda containers to.
    name: aws-resilient-payment-flow
