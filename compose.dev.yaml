# Local stand-ins for AWS services, started by npm run dev.
# Lambdas that SAM runs join this Compose network, so they reach each service by its name; host
# tools use the published ports.
name: aws-resilient-payment-flow

services:
  # Starts without tables; npm run dev creates the ones Terraform defines.
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    # One database for every access key and region, so the Lambdas, setup scripts, and the admin UI
    # see the same tables. It lives in a volume, so data survives container restarts.
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    # A new named volume is owned by root, which the image's default user cannot write to.
    user: root
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      # Any HTTP response, even the error for this unsigned request, means the server accepts requests.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Web UI for browsing and editing DynamoDB Local tables.
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:5.3.4
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      dynamodb:
        condition: service_healthy

  # SQS-compatible queues. Starts without queues; npm run dev creates the ones Terraform defines.
  sqs:
    image: softwaremill/elasticmq-native:1.7.1
    # Queue URLs take the host of each request, so the Lambdas get URLs with this service's name and
    # host tools get localhost URLs. Queues and messages live in memory and end with the container.
    command: -Dnode-address.host=*
    ports:
      - "127.0.0.1:9324:9324"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://localhost:9324/?Action=ListQueues'"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Web UI for browsing queues and sending, receiving, and deleting their messages.
  # It receives messages only on request, so browsing never counts toward a queue's redrive limit.
  sqs-admin:
    image: softwaremill/elasticmq-ui:1.7.1
    environment:
      # Its own port, since the API takes the image's default of 3000.
      PORT: 9325
      SQS_ENDPOINT: http://sqs:9324
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "127.0.0.1:9325:9325"
    depends_on:
      sqs:
        condition: service_healthy

volumes:
  dynamodb-data:

networks:
  default:
    # Must match the network npm run dev attaches the Lambda containers to.
    name: aws-resilient-payment-flow
